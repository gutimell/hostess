<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - GutiGenius</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gg-dark-blue: #0A2B4C; /* Azul oscuro del logo */
            --gg-yellow: #FFC107;    /* Amarillo del logo */
            --gg-teal: #20c997;      /* Turquesa del logo */
            --gg-light-gray: #f8f9fa;
            --gg-text: #212529;
        }

        body { 
            background-color: var(--gg-light-gray); 
            font-family: 'Poppins', sans-serif;
            color: var(--gg-text);
        }
        
        .btn-primary {
            background-color: var(--gg-dark-blue);
            border-color: var(--gg-dark-blue);
        }
        .btn-primary:hover {
            background-color: #08223c;
            border-color: #08223c;
        }
        .btn-outline-primary {
            color: var(--gg-dark-blue);
            border-color: var(--gg-dark-blue);
        }
        .btn-outline-primary:hover, .btn-check:checked+.btn-outline-primary {
            background-color: var(--gg-dark-blue);
            color: white;
        }
        
        .text-primary { color: var(--gg-dark-blue) !important; }
        .text-accent { color: var(--gg-yellow) !important; }
        
        .card, .btn, .form-control, .list-group-item { border-radius: 0.8rem; }
        
        .menu-button { 
            transition: transform 0.2s, box-shadow 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #dee2e6;
        }
        .menu-button:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .menu-button .icon-circle {
            background-color: #e9ecef;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--gg-dark-blue);
            transition: background-color 0.2s, color 0.2s;
        }
        .menu-button:hover .icon-circle {
            background-color: var(--gg-yellow);
            color: var(--gg-dark-blue);
        }
        
        .accordion-button:not(.collapsed) { 
            color: var(--gg-dark-blue); 
            background-color: #fef8e4; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="p-3 mb-3 border-bottom bg-white sticky-top shadow-sm">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="{{ url_for('menu') if session.get('profile') else '#' }}" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <img src="{{ url_for('static', filename='gutigenius.png') }}" alt="GutiGenius Logo" style="height: 40px;">
                </a>

                {% if session.get('profile') %}
                <div class="dropdown text-end">
                    <a href="#" class="d-block link-dark text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1" style="font-size: 1.5rem;"></i>
                        {{ guest_name }}
                    </a>
                    <ul class="dropdown-menu text-small">
                        <li><a class="dropdown-item" href="{{ url_for('logout') }}">Salir y cambiar de usuario</a></li>
                    </ul>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="text-center text-muted py-4 mt-auto">
        <p>&copy; {{ now().year }} GutiGenius. ¡Disfruta tu estadía!</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
