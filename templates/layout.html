<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Guía Gutimell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f0f8ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card, .btn { border-radius: 0.8rem; }
        .menu-button { transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-button:hover { transform: scale(1.05); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .accordion-button:not(.collapsed) { color: #0c63e4; background-color: #e7f1ff; }
    </style>
</head>
<body>
    <header class="p-3 mb-3 border-bottom bg-white sticky-top shadow-sm">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="{{ url_for('menu') if session.get('profile') else '#' }}" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <i class="bi bi-house-heart-fill me-2" style="font-size: 2rem; color: #0d6efd;"></i>
                    <span class="fs-4">Guía Gutimell</span>
                </a>

                {% if session.get('profile') %}
                <div class="dropdown text-end">
                    <a href="#" class="d-block link-dark text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1" style="font-size: 1.5rem;"></i>
                        {{ guest_name }}
                    </a>
                    <ul class="dropdown-menu text-small">
                        <li><a class="dropdown-item" href="{{ url_for('logout') }}">Salir y cambiar de usuario</a></li>
                    </ul>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="text-center text-muted py-4">
        <p>&copy; {{ now().year }} Alojamientos Gutimell. ¡Disfruta tu estadía!</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
