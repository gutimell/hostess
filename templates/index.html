{% extends "layout.html" %}

{% block title %}Bienvenido a GutiGenius{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card p-4 p-md-5 text-center shadow-lg border-0" style="margin-top: 10vh;">
            <div class="card-body">
                <i class="bi bi-lightbulb-fill text-accent" style="font-size: 4rem;"></i>
                <h1 class="card-title h2 my-3 fw-bold">Bienvenid@ a Guti<span class="text-primary">Genius</span></h1>
                <p class="text-muted mb-4">Tu guía inteligente para una estadía perfecta.</p>
                
                <form method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Selecciona tu Departamento</label>
                        <div class="d-grid gap-2 d-sm-block" role="group" aria-label="Selector de departamento">
                            <input type="radio" class="btn-check" name="depto" id="depto1005" value="1005" autocomplete="off" required>
                            <label class="btn btn-outline-primary btn-lg" for="depto1005">Depto 1005</label>

                            <input type="radio" class="btn-check" name="depto" id="depto1006" value="1006" autocomplete="off" required>
                            <label class="btn btn-outline-primary btn-lg" for="depto1006">Depto 1006</label>
                        </div>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu Nombre" required>
                        <label for="nombre">2. Ingresa tu Nombre de Huésped</label>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}

                    <button type="submit" class="w-100 btn btn-primary btn-lg fw-bold">Acceder</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Deshabilita el menú superior en la página de login
    document.addEventListener('DOMContentLoaded', function() {
        const header = document.querySelector('header');
        const footer = document.querySelector('footer');
        if (header) header.style.display = 'none';
        if (footer) footer.style.display = 'none';
    });
</script>
{% endblock %}
