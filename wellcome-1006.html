<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información para Huéspedes - Alojamientos Gutimell</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDF8F0; /* Un beige muy suave y cálido para el fondo de la página */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem; /* Padding general para el body */
            box-sizing: border-box;
        }
        /* Contenedor principal de la hoja, más angosto y largo */
        .main-info-card {
            background-color: #ffffff; /* Fondo blanco puro para la tarjeta */
            border-radius: 2rem; /* Bordes redondeados suaves */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); /* Sombra suave y elegante */
            max-width: 480px; /* Más angosto */
            width: 100%;
            min-height: 75vh; /* Más largo */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Para que la imagen de cabecera respete el border-radius */
            position: relative; /* Para posicionar el logo si fuera necesario, aunque ya no se superpone */
        }
        /* Sección de cabecera para la imagen/logo del usuario */
        .header-section {
            width: 100%;
            height: 150px; /* Altura de la sección de la imagen */
            display: flex;
            justify-content: center;
            align-items: center; /* Centra la imagen verticalmente */
            background-color: #CFB084; /* Un tono café claro para el fondo */
            border-radius: 2rem 2rem 0 0; /* Bordes redondeados solo arriba */
            overflow: hidden;
            padding: 0.5rem; /* Padding interno para la imagen */
        }
        .header-user-image {
            width: 100%; /* La imagen ocupará el ancho disponible */
            max-width: 150px; /* Tamaño máximo para la imagen */
            height: auto;
            object-fit: contain; /* Asegura que la imagen se vea completa */
            display: block;
        }
        /* Contenedor principal de texto y QR codes */
        .content-area {
            padding: 2.5rem; /* Padding superior ajustado */
            text-align: center;
            flex-grow: 1; /* Permite que esta área ocupe el espacio restante */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribuye el espacio entre los elementos */
        }
        .qr-grid {
            display: flex;
            flex-direction: column; /* Siempre en columna para la hoja angosta */
            gap: 1.5rem; /* Espacio entre los elementos QR */
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 0.5rem;
            border-radius: 1rem; /* Bordes suaves */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); /* Sombra sutil */
            border: 2px solid #D3B8A3; /* Borde suave en tono café/manjar */
        }
        .qr-code-box {
            border: 3px solid #C8A880; /* Borde del QR más grueso y del color manjar */
            padding: 0.8rem;
            border-radius: 0.5rem;
            background-color: #fcfcfc;
            display: inline-block;
        }
        /* Ajustar colores de texto para un aspecto más delicado y nítido */
        h1 { color: #4A3F3A; font-weight: 600; } /* Marrón oscuro para títulos principales */
        h2 { color: #5F544A; font-weight: 500; } /* Marrón medio para subtítulos */
        p { color: #7A6F65; } /* Marrón suave para párrafos */
        .text-sm { color: #9B9085; font-weight: 400; } /* Tono más claro pero nítido para texto pequeño */

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            .main-info-card {
                max-width: 95%;
                min-height: auto;
                border-radius: 1.5rem;
            }
            .header-section {
                height: 100px; /* Altura más pequeña para la sección de la imagen en móviles */
                padding: 0.5rem;
            }
            .header-user-image {
                max-width: 150px; /* Tamaño máximo de la imagen en móviles */
            }
            .content-area {
                /*padding: 2rem 1.5rem 1.5rem;*/
                padding: 1rem;
            }
            .qr-container {
                padding: 0.1rem;
            }
            .qr-code-box {
                border-width: 1.5px;
            }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.5rem; }
            p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="main-info-card">
        <!-- Sección de cabecera para la imagen del usuario -->
        <div class="header-section">
            <!-- REEMPLAZA 'URL_DE_TU_IMAGEN_AQUI.jpg' CON LA RUTA DE TU IMAGEN -->
            <img src="img/gutimell.jpg" alt="" class="header-user-image">
        </div>

        <!-- Contenido principal de texto y QR codes -->
        <div class="content-area">
            <div>
                <h1 class="text-4xl leading-tight mb-2">
                    ¡Bienvenid@!
                </h1>
                <p class="text-lg mb-2">
                    Espero que disfruten su estadía...
                </p>
            </div>

            <div class="qr-grid">
                <!-- QR Code para Wi-Fi (primero) -->
                <div class="qr-container">
                    <h2 class="text-2xl mb-2">Conexión Wi-Fi Depto-1005</h2>
                    <p class="text-md mb-2">
                        Siempre conectado y actualizado<br>
                    </p>

                    <div id="qrcode-wifi" class="qr-code-box"></div>
                    <p class="text-sm mt-4">
                        
                    </p>
                </div>

                <!-- QR Code para la Guía de Estancia y Panoramas (segundo) -->
                <div class="qr-container">
                    <h2 class="text-2xl mb-2">Tu Guía de Estancia y Panoramas</h2>
                    <p class="text-md mb-2">
                        Usa nuestra App "GutiGenius" <br>
                    </p>
                    <div id="qrcode-app" class="qr-code-box"></div>
                    <p class="text-sm mt-4">
                        <!-- Aplicación Co-Anfitrión de Gutimell.<br>
                        Depto-1006/Nombre Huésped -->
                    </p>
                </div>
            </div>

            <p class="text-md mt-auto pt-4">
                *** Alojamientos Gutimell ***
            </p>
        </div>
    </div>

    <script>
        // Función para generar el código QR
        function generateQRCode(elementId, text, size = 200) {
            const element = document.getElementById(elementId);
            if (element) {
                element.innerHTML = '';
                if (typeof QRCode !== 'undefined') {
                    new QRCode(element, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark : "#333333",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                } else {
                    console.error("El objeto QRCode no está disponible cuando se llamó a generateQRCode.");
                }
            } else {
                console.error(`Elemento con ID '${elementId}' no encontrado para generar QR.`);
            }
        }

        // Cargar qrcode.js dinámicamente y ejecutar el código de generación de QR después de que se cargue
        const script = document.createElement('script');
        script.src = "https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js";
        script.onload = function() {
            console.log("qrcode.js cargado exitosamente.");

            const airbnbAppUrl = "https://hostess-6xd8.onrender.com";
            generateQRCode('qrcode-app', airbnbAppUrl, 200);

            const wifiSSID = 'Mellguti';
            const wifiPassword = 'GM1001SL';
            const wifiEncryption = 'WPA';
            const wifiQrData = `WIFI:T:${wifiEncryption};S:${wifiSSID};P:${wifiPassword};;`;
            generateQRCode('qrcode-wifi', wifiQrData, 200);

            if (wifiSSID === 'TU_SSID_AQUI' || wifiPassword === 'TU_CONTRASEÑA_AQUI') {
                console.warn("¡Atención! Por favor, actualiza el SSID y la contraseña de Wi-Fi en el código para que el QR de Wi-Fi funcione correctamente.");
            }
        };
        script.onerror = function() {
            console.error("Fallo al cargar qrcode.js. Por favor, verifica tu conexión a internet o el enlace CDN.");
            document.getElementById('qrcode-app').innerHTML = '<p class="text-red-500 text-center mt-4">Error: No se pudo cargar la librería de QR. Revisa tu conexión a internet.</p>';
            document.getElementById('qrcode-wifi').innerHTML = '<p class="text-red-500 text-center mt-4">Error: No se pudo cargar la librería de QR. Revisa tu conexión a internet.</p>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
