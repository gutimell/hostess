<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Informativa Imprimible</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDF8F0; /* Fondo suave de la página */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        /* Contenedor principal que simula la imagen a imprimir */
        .printable-card {
            width: 14cm;  /* Ancho: 14cm */
            height: 20cm; /* Largo: 20cm */
            border: 0.375cm solid #CFB288; /* Borde exterior grueso, mismo color que el fondo interior */
            background-color: #CFB288; /* Fondo interior color #CFB288 */
            border-radius: 0; /* Borde cuadrado */
            box-sizing: border-box; /* Asegura que el padding y el borde se incluyan en las dimensiones */
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Para que nada se salga del borde */
        }

        /* Imagen central */
        .central-image {
            max-width: 70%; /* Ajusta el tamaño de la imagen central */
            max-height: 50%;
            object-fit: contain;
            margin-bottom: 1rem; /* Espacio debajo de la imagen */
        }

        /* Contenedores para las esquinas */
        .corner-box {
            position: absolute;
            width: 5cm; /* Ancho de los cuadros de esquina */
            height: 5cm; /* Alto de los cuadros de esquina */
            border: 0.1cm solid #945820; /* Borde del mismo color que el principal (original) */
            background-color: #ffffff; /* Fondo blanco */
            border-radius: 0.8cm; /* Puntas redondeadas para los cuadros de esquina */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5cm;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.8em;
            line-height: 1.2;
            overflow: hidden; /* Asegura que el contenido no se salga */
        }

        .corner-box.top-left {
            top: 0.5cm;
            left: 0.5cm;
        }

        .corner-box.top-right {
            top: 0.5cm;
            right: 0.5cm;
        }

        .corner-box.bottom-left {
            bottom: 0.5cm;
            left: 0.5cm;
        }

        .corner-box.bottom-right {
            bottom: 0.5cm;
            right: 0.5cm;
        }

        .corner-box .qr-code-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilos específicos para el QR */
        .qr-code-box {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ajustes para impresión */
        @media print {
            body {
                background-color: #ffffff; /* Fondo blanco para impresión */
                margin: 0;
                padding: 0;
                display: block;
                min-height: auto;
            }
            .printable-card {
                margin: 0 auto; /* Centrar en la página impresa */
                box-shadow: none; /* Eliminar sombra en impresión */
                border-radius: 0; /* Quitar redondeado para impresión */
            }
        }

        /* Responsive adjustments for smaller screens (not for print dimensions) */
        @media (max-width: 768px) {
            .printable-card {
                width: 90vw; /* Ajusta a un porcentaje del viewport width */
                height: 130vw; /* Mantiene la proporción */
                border-width: 0.5cm; /* Ajuste para pantallas pequeñas */
                border-radius: 0; /* Cuadrado en móvil */
            }
            .corner-box {
                width: 20vw;
                height: 20vw;
                border-width: 0.1cm;
                border-radius: 0.05cm;
                padding: 0.2cm;
                font-size: 0.7em;
            }
            .corner-box.top-left, .corner-box.top-right,
            .corner-box.bottom-left, .corner-box.bottom-right {
                top: 0.2cm;
                left: 0.2cm;
                right: 0.2cm;
                bottom: 0.2cm;
            }
        }
    </style>
</head>
<body>
    <div class="printable-card">
        <!-- Imagen central -->
        <!-- REEMPLAZA 'URL_DE_TU_IMAGEN_AQUI.jpg' CON LA RUTA DE TU IMAGEN -->
        <img src="img/gutimell_size.jpg" alt="Imagen Central" class="central-image">

        <!-- Esquina Superior Izquierda: Texto -->
        <div class="corner-box top-left">
            <p class="font-semibold text-gray-800">
                ¡Bienvenid@ a<br>Alojamientos Gutimell!
            </p>
        </div>

        <!-- Esquina Superior Derecha: QR Wi-Fi -->
        <div class="corner-box top-right">
            <h3 class="text-xs font-semibold text-gray-700 mb-1">Wi-Fi Depto-1006</h3>
            <div id="qrcode-wifi" class="qr-code-box"></div>
        </div>

        <!-- Esquina Inferior Izquierda: QR Sitio Web -->
        <div class="corner-box bottom-left">
            <h3 class="text-xs font-semibold text-gray-700 mb-1">Tu Guía de Estancia</h3>
            <div id="qrcode-app" class="qr-code-box"></div>
        </div>

        <!-- Esquina Inferior Derecha: Texto -->
        <div class="corner-box bottom-right">
            <p class="font-semibold text-gray-800">
                ¡Disfruta tu<br>estancia!
            </p>
        </div>
    </div>

    <script>
        // Función para generar el código QR
        function generateQRCode(elementId, text, size = 100) { // Tamaño ajustado para los cuadros de esquina
            const element = document.getElementById(elementId);
            if (element) {
                element.innerHTML = '';
                if (typeof QRCode !== 'undefined') {
                    new QRCode(element, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark : "#333333",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                } else {
                    console.error("El objeto QRCode no está disponible cuando se llamó a generateQRCode.");
                }
            } else {
                console.error(`Elemento con ID '${elementId}' no encontrado para generar QR.`);
            }
        }

        // Cargar qrcode.js dinámicamente y ejecutar el código de generación de QR después de que se cargue
        const script = document.createElement('script');
        script.src = "https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js";
        script.onload = function() {
            console.log("qrcode.js cargado exitosamente.");

            // Generar QR para la aplicación web de Airbnb
            const airbnbAppUrl = "https://hostess-6xd8.onrender.com";
            generateQRCode('qrcode-app', airbnbAppUrl, 80); // Tamaño más pequeño para el QR

            // --- INSTRUCCIONES PARA EL CÓDIGO QR DE WI-FI ---
            const wifiSSID = 'Mellguti';
            const wifiPassword = 'GM1001SL';
            const wifiEncryption = 'WPA';
            const wifiQrData = `WIFI:T:${wifiEncryption};S:${wifiSSID};P:${wifiPassword};;`;
            generateQRCode('qrcode-wifi', wifiQrData, 80); // Tamaño más pequeño para el QR

            if (wifiSSID === 'TU_SSID_AQUI' || wifiPassword === 'TU_CONTRASEÑA_AQUI') {
                console.warn("¡Atención! Por favor, actualiza el SSID y la contraseña de Wi-Fi en el código para que el QR de Wi-Fi funcione correctamente.");
            }
        };
        script.onerror = function() {
            console.error("Fallo al cargar qrcode.js. Por favor, verifica tu conexión a internet o el enlace CDN.");
            document.getElementById('qrcode-app').innerHTML = '<p class="text-red-500 text-center text-xs mt-1">Error QR</p>';
            document.getElementById('qrcode-wifi').innerHTML = '<p class="text-red-500 text-center text-xs mt-1">Error QR</p>';
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
